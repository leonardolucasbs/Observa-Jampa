log_level = "INFO"
timezone = "America/Fortaleza"
primary_location = "joao-pessoa"

[database]
path = "data/itinerario.db"

[http]
timeout_seconds = 30
retries = 3
backoff_factor = 1.0

[air_quality]
base_url = "https://air-quality-api.open-meteo.com/v1/air-quality"
collect_past_days = 2
forecast_days = 1
max_past_days = 92

[who_guidelines_24h]
pm2_5 = 15
nitrogen_dioxide = 25

[dashboard]
period_options = [7, 30, 90]
cache_ttl_seconds = 300
attribution = "Dados de qualidade do ar: Open-Meteo, CAMS / Copernicus Atmosphere Monitoring Service — licença CC BY 4.0"
disclaimer = "Os valores são estimativas do modelo de previsão CAMS (resolução de dezenas de km), não medições de sensores locais."

