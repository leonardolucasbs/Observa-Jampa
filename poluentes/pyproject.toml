[project]
name = "itinerario"
version = "0.1.0"
description = "Dados ambientais de João Pessoa: qualidade do ar (Open-Meteo / CAMS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pydeck>=0.9.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
