[project]
name = "observa-jampa"
version = "0.1.0"
description = "ObservaJP — Observatório Ambiental de João Pessoa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pydeck>=0.9.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

# Instala src/pages como o pacote `pages`: assim `python -m pages.<tema>...` e os testes enxergam o código.
[tool.uv.build-backend]
module-name = "pages"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
